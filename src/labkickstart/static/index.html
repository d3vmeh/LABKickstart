<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LABKickstart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
  <style>
    :root {
      color-scheme: light;
      /* Plain white base, warm accents reserved for highlights. */
      --paper:        #ffffff;
      --paper-deep:   #f4f4f5;
      --surface:      #ffffff;
      --ink:          #1d1a14;
      --ink-soft:     #5a5346;
      --rule:         #e5e3dd;
      --rule-soft:    #efece5;
      --primary:      #0c4a48;        /* deep teal */
      --primary-700:  #082f2e;
      --primary-100:  #d4e3e0;
      --danger:       #9a3a2a;        /* warm rust */
      --danger-700:   #76281b;
      --ok:           #316e3c;        /* moss green */
      --accent:       #b9863c;        /* aged brass */
      --shadow:       0 1px 0 rgba(29,26,20,0.04), 0 1px 3px rgba(29,26,20,0.05);
      --font-sans: "IBM Plex Sans", -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --font-serif: "IBM Plex Serif", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body {
      background: var(--paper);
      color: var(--ink);
    }
    /* Subtle dot-grid like graph paper. Dots are tiny + low contrast so it's
       atmosphere, not pattern. */
    body {
      font: 14px/1.55 var(--font-sans);
      padding: 32px 24px 56px;
      max-width: 1080px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font: 500 28px/1.1 var(--font-serif);
      letter-spacing: .005em;
      font-style: italic;
    }
    h1::after {
      content: "";
      display: block;
      width: 56px;
      height: 2px;
      margin: 10px 0 6px;
      background: var(--ink);
      opacity: .85;
    }
    .sub {
      color: var(--ink-soft);
      margin: 0 0 28px;
      font: 500 12px/1 var(--font-mono);
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 4px;
      padding: 20px 22px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      animation: section-in .5s ease both;
    }
    section:nth-of-type(1) { animation-delay: .04s; }
    section:nth-of-type(2) { animation-delay: .10s; }
    section:nth-of-type(3) { animation-delay: .16s; }
    section:nth-of-type(4) { animation-delay: .22s; }
    section:nth-of-type(5) { animation-delay: .28s; }
    @keyframes section-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }
    section h2 {
      margin: 0 0 14px;
      font: 600 11px/1 var(--font-mono);
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--ink-soft);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    section h2::before {
      content: "§";
      color: var(--accent);
      font: 500 13px/1 var(--font-serif);
      font-style: italic;
    }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    button {
      font: 500 13px/1 var(--font-sans);
      padding: 9px 16px;
      border-radius: 3px;
      border: 1px solid var(--rule);
      background: var(--paper-deep);
      color: var(--ink);
      cursor: pointer;
      transition: background .15s, border-color .15s, transform .05s;
    }
    button:hover { background: #e7e7e9; border-color: #d2d2d7; }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--primary);
      color: var(--paper);
      border-color: var(--primary);
    }
    button.primary:hover { background: var(--primary-700); border-color: var(--primary-700); }
    button.danger {
      background: var(--danger);
      color: var(--paper);
      border-color: var(--danger);
    }
    button.danger:hover { background: var(--danger-700); border-color: var(--danger-700); }
    button:disabled { opacity: .42; cursor: not-allowed; }

    input[type=text], input[type=number], select, textarea {
      font: 14px/1.4 var(--font-sans);
      padding: 8px 11px;
      border-radius: 3px;
      border: 1px solid var(--rule);
      background: var(--surface);
      color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-100);
    }
    input[type=text] { min-width: 200px; }
    input[type=number] { width: 110px; font-family: var(--font-mono); }
    label { color: var(--ink-soft); font-size: 13px; }
    .param-group { display: inline-flex; align-items: center; gap: 6px; }

    #kit-diagrams { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .diagram { border: 1px solid var(--rule-soft); border-radius: 3px; background: var(--paper); }
    .diagram > summary {
      list-style: none; cursor: pointer;
      padding: 10px 14px;
      font: 600 11px/1 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
      user-select: none;
      display: flex; align-items: center; gap: 10px;
    }
    .diagram > summary::-webkit-details-marker { display: none; }
    .diagram > summary::before {
      content: "▸";
      color: var(--primary);
      font-size: 11px;
      transition: transform .15s;
    }
    .diagram[open] > summary::before { transform: rotate(90deg); }
    .diagram > summary:hover { color: var(--ink); }
    .diagram-body { padding: 0 14px 14px; }
    .diagram-body img { display: block; width: 100%; height: auto; }
    .diagram-body p { margin: 8px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }

    #kit-lab-guide { margin-top: 8px; }
    .lg-empty, .lg-busy, .lg-error { padding: 10px 0; font-size: 13px; }
    .lg-busy { color: var(--ink-soft); font-style: italic; }
    .lg-busy::before { content: "✦"; margin-right: 8px; color: var(--accent); animation: spin 2s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lg-error { color: var(--danger); }
    .lg-section { margin-top: 16px; }
    .lg-section h4 {
      margin: 0 0 8px;
      font: 600 11px/1 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    .lg-materials { list-style: none; padding: 0; margin: 0; }
    .lg-materials li {
      padding: 6px 0;
      border-bottom: 1px dashed var(--rule-soft);
      font-size: 13px;
    }
    .lg-materials li:last-child { border-bottom: none; }
    .lg-materials li::before {
      content: "□";
      color: var(--accent);
      margin-right: 10px;
      font-family: var(--font-mono);
    }
    .lg-materials .qty { color: var(--ink-soft); font-family: var(--font-mono); font-size: 12px; }
    .lg-materials .note { color: var(--ink-soft); font-style: italic; }
    .lg-steps { display: flex; flex-direction: column; gap: 8px; }
    .lg-step { border: 1px solid var(--rule-soft); border-radius: 3px; background: var(--surface); padding: 0; }
    .lg-step > .lg-step-action { display: flex; gap: 14px; padding: 12px 14px; align-items: baseline; }
    .lg-step .n {
      font: 500 14px/1 var(--font-mono);
      color: var(--accent);
      min-width: 24px;
      font-variant-numeric: tabular-nums;
    }
    .lg-step details summary {
      cursor: pointer;
      padding: 0 14px 12px 52px;
      color: var(--primary);
      list-style: none;
      font: 500 11px/1 var(--font-mono);
      letter-spacing: .14em;
      text-transform: uppercase;
      user-select: none;
    }
    .lg-step details summary::-webkit-details-marker { display: none; }
    .lg-step details summary::before { content: "▸ why?"; transition: none; }
    .lg-step details[open] summary::before { content: "▾ why"; }
    .lg-step details .lg-reason {
      padding: 0 14px 14px 52px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.6;
      border-left: 2px solid var(--accent);
      margin-left: 30px;
      padding-left: 16px;
    }
    .lg-replace { margin-top: 16px; font-size: 12px; color: var(--ink-soft); display: flex; gap: 10px; align-items: center; }
    .lg-replace a { cursor: pointer; color: var(--primary); border-bottom: 1px dotted var(--primary); }
    .lg-tabs { display: flex; gap: 0; margin: 4px 0 12px; border-bottom: 1px solid var(--rule); }
    .lg-tab {
      font: 500 12px/1 var(--font-mono);
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 0;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .lg-tab:hover { color: var(--ink); background: transparent; }
    .lg-tab.active {
      background: transparent;
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .lg-text {
      width: 100%; min-height: 150px; box-sizing: border-box;
      padding: 12px; font: 13px/1.5 var(--font-mono);
      border-radius: 3px; border: 1px solid var(--rule);
      background: var(--surface); color: var(--ink); resize: vertical;
    }
    .lg-upload-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .lg-upload-row .hint { font-size: 12px; color: var(--ink-soft); font-style: italic; }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 9px 4px;
      border-bottom: 1px dashed var(--rule-soft);
      font-variant-numeric: tabular-nums;
    }
    th {
      font: 600 10px/1 var(--font-mono);
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }
    code { font: 13px/1 var(--font-mono); color: var(--ink); }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      font: 500 11px/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
    .pill.ok { background: rgba(49,110,60,.12); color: var(--ok); }
    .pill.ok::before { background: var(--ok); box-shadow: 0 0 0 0 rgba(49,110,60,.6); animation: pulse 1.6s ease-out infinite; }
    .pill.off { background: var(--rule-soft); color: var(--ink-soft); }
    .pill.off::before { background: var(--ink-soft); }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(49,110,60,.5); }
      70%  { box-shadow: 0 0 0 6px rgba(49,110,60,0); }
      100% { box-shadow: 0 0 0 0 rgba(49,110,60,0); }
    }
    #chart { width: 100%; }
    .status {
      font: 500 12px/1 var(--font-mono);
      letter-spacing: .06em;
      color: var(--ink-soft);
    }
    .status.live { color: var(--ok); }
    .status.live::before { content: "● "; animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    a { color: var(--primary); text-decoration-color: var(--rule); text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--primary); }

    /* uPlot color overrides — match the lab palette so the chart fits the rest. */
    .uplot, .uplot * { font-family: var(--font-mono); }
    .uplot .u-axis { color: var(--ink-soft); }
  </style>
</head>
<body>
  <h1>LABKickstart</h1>
  <div class="sub">Modular physics lab hub</div>

  <section>
    <h2>Devices</h2>
    <table id="devices"><thead><tr><th>Name</th><th>ID</th><th>RSSI</th><th>Status</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Kit</h2>
    <div class="row">
      <label for="kit-select">Experiment</label>
      <select id="kit-select"></select>
    </div>
    <p id="kit-desc" class="sub" style="margin: 8px 0 0"></p>
    <div id="kit-diagrams"></div>
    <div id="kit-lab-guide"></div>
    <div id="kit-params" class="row" style="margin-top: 12px"></div>
    <div class="row" style="margin-top: 12px">
      <button id="kit-apply" class="primary">Apply kit</button>
      <span id="kit-status" class="status">no kit selected</span>
    </div>
  </section>

  <section>
    <h2>Run</h2>
    <div class="row">
      <input id="run-name" type="text" placeholder="run name (e.g., cart-incline-1)" />
      <button id="arm" class="primary" disabled>Arm</button>
      <button id="stop" class="danger" disabled>Stop</button>
      <span id="run-status" class="status">apply a kit to enable</span>
    </div>
  </section>

  <section>
    <h2>Live</h2>
    <div id="chart"></div>
    <div class="row" style="margin-top:8px">
      <span id="ws-status" class="status">connecting…</span>
      <span style="flex:1"></span>
      <button id="clear-chart">Clear chart</button>
    </div>
  </section>

  <section>
    <h2>History</h2>
    <table id="runs"><thead><tr><th>Run ID</th><th>Name</th><th>Size</th><th></th></tr></thead><tbody></tbody></table>
    <div class="row" style="margin-top:12px; justify-content: flex-end">
      <button id="delete-all" class="danger" title="Debug: delete all stored runs">Delete all runs</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
