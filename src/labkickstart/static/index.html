<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LABKickstart</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
  <style>
    :root { color-scheme: light; }
    html, body { background: #ffffff; color: #1d1d1f; }
    body { font: 14px/1.4 system-ui, sans-serif; padding: 24px; max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: #6b6b70; margin-bottom: 24px; }
    section { background: #ffffff; border: 1px solid #e5e5ea; border-radius: 8px; padding: 16px; margin-bottom: 18px; }
    section h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: .5px; color: #6b6b70; }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #d2d2d7; background: #f5f5f7; color: #1d1d1f; cursor: pointer; }
    button:hover { background: #ececef; }
    button.primary { background: #1f6feb; color: #ffffff; border-color: #1f6feb; }
    button.primary:hover { background: #195fcc; }
    button.danger { background: #d23; color: #ffffff; border-color: #d23; }
    button.danger:hover { background: #b81f2a; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    input[type=text], input[type=number], select { font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #d2d2d7; background: #ffffff; color: #1d1d1f; }
    input[type=text] { min-width: 200px; }
    input[type=number] { width: 110px; }
    label { color: #6b6b70; }
    .param-group { display: inline-flex; align-items: center; gap: 6px; }
    #kit-diagrams { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .diagram { border: 1px solid #e5e5ea; border-radius: 8px; background: #fafafa; }
    .diagram summary { list-style: none; cursor: pointer; padding: 10px 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .4px; color: #6b6b70; user-select: none; display: flex; align-items: center; gap: 8px; }
    .diagram summary::-webkit-details-marker { display: none; }
    .diagram summary::before { content: "▸"; color: #1f6feb; font-size: 11px; transition: transform .15s; }
    .diagram[open] summary::before { transform: rotate(90deg); }
    .diagram summary:hover { color: #1d1d1f; }
    .diagram-body { padding: 0 14px 14px; }
    .diagram-body img { display: block; width: 100%; height: auto; }
    .diagram-body p { margin: 8px 0 0; font-size: 12px; color: #6b6b70; }

    /* Lab guide panel reuses the .diagram dropdown shell so styles stay consistent. */
    #kit-lab-guide { margin-top: 8px; }
    .lg-empty, .lg-busy, .lg-error { padding: 10px 0; }
    .lg-error { color: #b81f2a; }
    .lg-section { margin-top: 14px; }
    .lg-section h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #6b6b70; }
    .lg-materials { list-style: disc; padding-left: 22px; margin: 0; }
    .lg-materials li { margin: 2px 0; }
    .lg-materials .qty { color: #6b6b70; }
    .lg-materials .note { color: #6b6b70; font-style: italic; }
    .lg-steps { display: flex; flex-direction: column; gap: 8px; }
    .lg-step { border: 1px solid #e5e5ea; border-radius: 6px; background: #ffffff; padding: 0; }
    .lg-step > .lg-step-action { display: flex; gap: 10px; padding: 10px 12px; align-items: baseline; }
    .lg-step .n { font-weight: 600; color: #1f6feb; min-width: 22px; font-variant-numeric: tabular-nums; }
    .lg-step details summary { cursor: pointer; padding: 0 12px 10px 44px; color: #1f6feb; list-style: none; font-size: 12px; user-select: none; }
    .lg-step details summary::-webkit-details-marker { display: none; }
    .lg-step details summary::before { content: "▸ Why?"; transition: none; }
    .lg-step details[open] summary::before { content: "▾ Why?"; }
    .lg-step details .lg-reason { padding: 0 12px 12px 44px; color: #1d1d1f; font-size: 13px; line-height: 1.5; }
    .lg-replace { margin-top: 14px; font-size: 12px; color: #6b6b70; display: flex; gap: 10px; align-items: center; }
    .lg-replace a { cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e5e5ea; font-variant-numeric: tabular-nums; }
    th { font-size: 12px; text-transform: uppercase; color: #6b6b70; font-weight: 600; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .pill.ok { background: #2ea04322; color: #2ea043; }
    .pill.off { background: #e5e5ea; color: #6b6b70; }
    #chart { width: 100%; }
    .status { font-variant-numeric: tabular-nums; color: #6b6b70; }
    .status.live { color: #2ea043; }
    a { color: #1f6feb; }
  </style>
</head>
<body>
  <h1>LABKickstart</h1>
  <div class="sub">Modular physics lab hub</div>

  <section>
    <h2>Devices</h2>
    <table id="devices"><thead><tr><th>Name</th><th>ID</th><th>RSSI</th><th>Status</th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Kit</h2>
    <div class="row">
      <label for="kit-select">Experiment</label>
      <select id="kit-select"></select>
    </div>
    <p id="kit-desc" class="sub" style="margin: 8px 0 0"></p>
    <div id="kit-diagrams"></div>
    <div id="kit-lab-guide"></div>
    <div id="kit-params" class="row" style="margin-top: 12px"></div>
    <div class="row" style="margin-top: 12px">
      <button id="kit-apply" class="primary">Apply kit</button>
      <span id="kit-status" class="status">no kit selected</span>
    </div>
  </section>

  <section>
    <h2>Run</h2>
    <div class="row">
      <input id="run-name" type="text" placeholder="run name (e.g., cart-incline-1)" />
      <button id="arm" class="primary" disabled>Arm</button>
      <button id="stop" class="danger" disabled>Stop</button>
      <span id="run-status" class="status">apply a kit to enable</span>
    </div>
  </section>

  <section>
    <h2>Live</h2>
    <div id="chart"></div>
    <div class="row" style="margin-top:8px">
      <span id="ws-status" class="status">connecting…</span>
      <span style="flex:1"></span>
      <button id="clear-chart">Clear chart</button>
    </div>
  </section>

  <section>
    <h2>History</h2>
    <table id="runs"><thead><tr><th>Run ID</th><th>Name</th><th>Size</th><th></th></tr></thead><tbody></tbody></table>
    <div class="row" style="margin-top:12px; justify-content: flex-end">
      <button id="delete-all" class="danger" title="Debug: delete all stored runs">Delete all runs</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
