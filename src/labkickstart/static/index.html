<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LABKickstart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Computer Modern (LaTeX serif) for headings -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/fonts.css">
  <!-- Courier Prime: typewriter for body and data -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.min.css">
  <style>
    :root {
      color-scheme: light;
      /* Late-50s lab report: stark white sheet, ink-black type,
         one academic-blue accent, typewriter-ribbon red for danger. */
      --paper:        #ffffff;
      --paper-deep:   #f7f6f2;
      --surface:      #ffffff;
      --ink:          #111111;
      --ink-soft:     #555555;
      --rule:         #1a1a1a;        /* hairline rules are stark */
      --rule-soft:    #c8c4ba;
      --primary:      #1a3a6e;        /* academic ink blue */
      --primary-700:  #0f2447;
      --primary-100:  #d6dee9;
      --danger:       #a13a2a;        /* typewriter ribbon red */
      --danger-700:   #76281b;
      --ok:           #2c5b30;        /* deep moss */
      --accent:       #8a6e2a;        /* muted ochre */
      /* Computer Modern (Latin Modern) for headings; Courier Prime for body. */
      --font-display: "Computer Modern Serif", "Latin Modern Roman", "CMU Serif", Georgia, serif;
      --font-body:    "Courier Prime", "Courier New", "Courier", monospace;
      --font-mono:    "Courier Prime", "Courier New", monospace;
      --font-serif:   "Computer Modern Serif", Georgia, serif;
    }
    * { box-sizing: border-box; }
    html, body {
      background: var(--paper);
      color: var(--ink);
    }
    /* Subtle dot-grid like graph paper. Dots are tiny + low contrast so it's
       atmosphere, not pattern. */
    body {
      font: 13px/1.6 var(--font-body);
      padding: 40px 24px 60px;
      max-width: 980px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      font: italic 400 38px/1.05 var(--font-display);
      letter-spacing: .01em;
      text-align: center;
    }
    h1::after {
      content: "";
      display: block;
      width: 100%;
      height: 1px;
      margin: 14px 0 0;
      background: var(--ink);
    }
    .sub {
      color: var(--ink);
      margin: 4px 0 36px;
      font: 13px/1 var(--font-body);
      letter-spacing: .2em;
      text-transform: uppercase;
      text-align: center;
    }
    section {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 0;                  /* no rounded modern corners */
      padding: 22px 24px;
      margin-bottom: 18px;
      animation: section-in .5s ease both;
    }
    section:nth-of-type(1) { animation-delay: .04s; }
    section:nth-of-type(2) { animation-delay: .10s; }
    section:nth-of-type(3) { animation-delay: .16s; }
    section:nth-of-type(4) { animation-delay: .22s; }
    section:nth-of-type(5) { animation-delay: .28s; }
    @keyframes section-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }
    section h2 {
      margin: 0 0 16px;
      font: italic 400 20px/1 var(--font-display);
      letter-spacing: .005em;
      color: var(--ink);
      text-transform: none;
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 6px;
      padding-right: 36px;
    }
    section h2::before {
      content: "§";
      color: var(--ink);
      font: italic 400 18px/1 var(--font-display);
    }
    .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    button {
      font: 400 12px/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 0;                /* sharp rectangles */
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    button:hover { background: var(--ink); color: var(--paper); }
    button:active { transform: translateY(1px); }
    button.primary {
      background: var(--primary);
      color: var(--paper);
      border-color: var(--primary);
    }
    button.primary:hover { background: var(--paper); color: var(--primary); }
    button.danger {
      background: var(--danger);
      color: var(--paper);
      border-color: var(--danger);
    }
    button.danger:hover { background: var(--paper); color: var(--danger); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    button:disabled:hover { background: var(--paper); color: var(--ink); }

    input[type=text], input[type=number], select, textarea {
      font: 13px/1.4 var(--font-mono);
      padding: 7px 10px;
      border-radius: 0;
      border: 1px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    input[type=text]:focus, input[type=number]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-100);
    }
    input[type=text] { min-width: 200px; }
    input[type=number] { width: 100px; font-family: var(--font-mono); }
    label { color: var(--ink); font-size: 13px; font-family: var(--font-mono); }
    .param-group { display: inline-flex; align-items: center; gap: 6px; }

    #kit-diagrams { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
    .diagram { border: 1px solid var(--rule); border-radius: 0; background: var(--paper); }
    .diagram > summary {
      list-style: none; cursor: pointer;
      padding: 10px 14px;
      font: italic 400 15px/1 var(--font-display);
      letter-spacing: .005em;
      color: var(--ink);
      user-select: none;
      display: flex; align-items: center; gap: 10px;
    }
    .diagram > summary::-webkit-details-marker { display: none; }
    .diagram > summary::before {
      content: "▸";
      color: var(--ink);
      font-size: 11px;
      transition: transform .15s;
    }
    .diagram[open] > summary::before { transform: rotate(90deg); }
    .diagram > summary:hover { color: var(--ink); }
    .diagram-body { padding: 0 14px 14px; }
    .diagram-body img { display: block; width: 100%; height: auto; }
    .diagram-body p { margin: 8px 0 0; font-size: 12px; color: var(--ink-soft); line-height: 1.5; }

    #kit-lab-guide { margin-top: 8px; }
    .lg-empty, .lg-busy, .lg-error { padding: 10px 0; font-size: 13px; }
    .lg-busy { color: var(--ink-soft); font-style: italic; }
    .lg-busy::before { content: "✦"; margin-right: 8px; color: var(--accent); animation: spin 2s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .lg-error { color: var(--danger); }
    .lg-section { margin-top: 16px; }
    .lg-section h4 {
      margin: 0 0 10px;
      font: italic 400 16px/1 var(--font-display);
      letter-spacing: 0;
      color: var(--ink);
      border-bottom: 1px solid var(--rule-soft);
      padding-bottom: 4px;
    }
    .lg-materials { list-style: none; padding: 0; margin: 0; }
    .lg-materials li {
      padding: 6px 0;
      border-bottom: 1px dashed var(--rule-soft);
      font-size: 13px;
    }
    .lg-materials li:last-child { border-bottom: none; }
    .lg-materials li::before {
      content: "□";
      color: var(--accent);
      margin-right: 10px;
      font-family: var(--font-mono);
    }
    .lg-materials .qty { color: var(--ink-soft); font-family: var(--font-mono); font-size: 12px; }
    .lg-materials .note { color: var(--ink-soft); font-style: italic; }
    .lg-steps { display: flex; flex-direction: column; gap: 8px; }
    .lg-step { border: 1px solid var(--rule-soft); border-radius: 0; background: var(--surface); padding: 0; }
    .lg-step > .lg-step-action { display: flex; gap: 14px; padding: 12px 14px; align-items: baseline; }
    .lg-step .n {
      font: italic 400 15px/1 var(--font-display);
      color: var(--ink);
      min-width: 24px;
      font-variant-numeric: tabular-nums;
    }
    .lg-step details summary {
      cursor: pointer;
      padding: 0 14px 12px 52px;
      color: var(--primary);
      list-style: none;
      font: italic 400 12px/1 var(--font-display);
      text-transform: lowercase;
      user-select: none;
    }
    .lg-step details summary::-webkit-details-marker { display: none; }
    .lg-step details summary::before { content: "▸ why?"; transition: none; }
    .lg-step details[open] summary::before { content: "▾ why"; }
    .lg-step details .lg-reason {
      padding: 0 14px 14px 52px;
      color: var(--ink);
      font: 13px/1.6 var(--font-body);
      border-left: 1px solid var(--ink);
      margin-left: 30px;
      padding-left: 16px;
    }
    .lg-replace { margin-top: 16px; font-size: 12px; color: var(--ink-soft); display: flex; gap: 10px; align-items: center; }
    .lg-replace a { cursor: pointer; color: var(--primary); border-bottom: 1px dotted var(--primary); }
    .lg-tabs { display: flex; gap: 0; margin: 4px 0 12px; border-bottom: 1px solid var(--ink); }
    .lg-tab {
      font: 12px/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 0;
      border: none;
      background: transparent;
      color: var(--ink-soft);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .lg-tab:hover { color: var(--ink); background: transparent; }
    .lg-tab.active {
      background: transparent;
      color: var(--ink);
      border-bottom-color: var(--ink);
    }
    .lg-text {
      width: 100%; min-height: 150px; box-sizing: border-box;
      padding: 12px; font: 13px/1.5 var(--font-mono);
      border-radius: 0; border: 1px solid var(--rule);
      background: var(--surface); color: var(--ink); resize: vertical;
    }
    .lg-upload-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .lg-upload-row .hint { font-size: 12px; color: var(--ink-soft); font-style: italic; }

    /* Stop conditions (kit-declared triggers) under the Run controls. */
    #run-triggers:not(:empty) {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--rule-soft);
    }
    .trig-head {
      font: italic 400 14px/1 var(--font-display);
      margin-bottom: 8px;
      color: var(--ink);
    }
    .trig-row {
      display: flex; align-items: center; gap: 8px;
      font: 12px/1.4 var(--font-mono);
      padding: 4px 0;
    }
    .trig-row label.lbl { color: var(--ink); }
    .trig-row input[type=number] { width: 90px; }
    .trig-row .unit { color: var(--ink-soft); }

    /* Kit recommender (PDF -> LLM -> ranked kit list) */
    #kit-recommend { margin-top: 12px; padding: 12px; border: 1px dashed var(--rule); background: var(--surface); }
    .kr-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .kr-row .hint { font-size: 12px; color: var(--ink-soft); font-style: italic; }
    .kr-list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .kr-item {
      padding: 10px 12px;
      border: 1px solid var(--rule);
      background: var(--paper);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
    }
    .kr-item .kr-head {
      font: italic 400 15px/1.2 var(--font-display);
      color: var(--ink);
    }
    .kr-item .kr-rationale { font: 12px/1.5 var(--font-mono); color: var(--ink); grid-column: 1 / -1; }
    .kr-item .kr-modules { font: 11px/1.3 var(--font-mono); color: var(--ink-soft); grid-column: 1 / -1; }
    .kr-item .kr-conf {
      font: 11px/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      align-self: start;
    }
    .kr-item .kr-conf.high { color: var(--ok); }
    .kr-item .kr-conf.low { color: var(--danger); }
    .kr-item .kr-actions { grid-column: 1 / -1; display: flex; gap: 8px; }
    .kr-status { font: 12px/1.4 var(--font-mono); color: var(--ink-soft); }
    .kr-status.lg-error { color: var(--danger); }

    /* Quicklook: per-run summary stats panel */
    .quicklook-row td {
      padding: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--rule-soft);
    }
    .ql-panel { padding: 14px 12px; }
    .ql-head {
      font: italic 400 14px/1 var(--font-display);
      margin-bottom: 10px;
      color: var(--ink);
    }
    .ql-channel {
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--rule-soft);
    }
    .ql-channel:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .ql-channel-name {
      font: 13px/1 var(--font-mono);
      color: var(--ink);
      margin-bottom: 6px;
      letter-spacing: .04em;
    }
    .ql-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 6px 14px;
    }
    .ql-stat {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font: 12px/1.4 var(--font-mono);
      color: var(--ink);
    }
    .ql-stat .name { color: var(--ink-soft); }
    .ql-stat .val { font-variant-numeric: tabular-nums; }

    table {
      width: 100%;
      border-collapse: collapse;
      border-top: 1px solid var(--ink);
      border-bottom: 1px solid var(--ink);
    }
    th, td {
      text-align: left;
      padding: 8px 6px;
      border-bottom: 1px solid var(--rule-soft);
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }
    tr:last-child td { border-bottom: none; }
    th {
      font: 12px/1 var(--font-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--ink);
      border-bottom: 1px solid var(--ink);
      padding-bottom: 6px;
    }
    code { font: 13px/1 var(--font-mono); color: var(--ink); }
    /* Pills are bracketed mono labels in this aesthetic instead of colored capsules. */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      border-radius: 0;
      font: 12px/1 var(--font-mono);
      letter-spacing: .04em;
      text-transform: lowercase;
    }
    .pill::before { content: "["; }
    .pill::after  { content: "]"; }
    .pill.ok    { color: var(--ok); }
    .pill.off   { color: var(--ink-soft); }
    #chart { width: 100%; }
    .status {
      font: 12px/1 var(--font-mono);
      letter-spacing: .04em;
      color: var(--ink-soft);
    }
    .status.live { color: var(--ok); }
    .status.live::before { content: "● "; animation: blink 1.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    a { color: var(--primary); text-decoration-color: var(--ink); text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--primary); }

    /* uPlot: typewriter axes/legend so the chart matches the report aesthetic. */
    .uplot, .uplot * { font-family: var(--font-mono); }
    .uplot .u-axis { color: var(--ink); }
    .uplot .u-legend { font-size: 11px; }

    /* Per-device chart cards */
    #charts { display: flex; flex-direction: column; gap: 14px; }
    .chart-card {
      border: 1px solid var(--rule);
      border-radius: 0;
      background: var(--surface);
      padding: 12px 14px 10px;
    }
    .chart-card-head {
      display: flex; align-items: baseline; gap: 14px;
      padding-bottom: 8px;
      border-bottom: 1px dashed var(--rule-soft);
      margin-bottom: 8px;
    }
    .chart-card-title {
      font: italic 400 16px/1 var(--font-display);
      color: var(--ink);
    }
    .chart-card-meta { font: 12px/1 var(--font-mono); color: var(--ink-soft); }
    .chart-toggles { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 8px; }
    .chart-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none;
      font: 500 11px/1 var(--font-mono);
      letter-spacing: .04em;
      color: var(--ink);
      padding: 3px 6px;
      border-radius: 0;
      transition: background .12s;
    }
    .chart-toggle:hover { background: var(--rule-soft); }
    .chart-toggle input { margin: 0; accent-color: var(--primary); }
    .chart-toggle .swatch {
      width: 10px; height: 10px; border-radius: 2px; display: inline-block;
    }
    .chart-toggle.off { color: var(--ink-soft); }
    .chart-toggle.off .swatch { opacity: .25; }
  </style>
</head>
<body>
  <h1>LABKickstart</h1>
  <div class="sub">Modular physics lab hub</div>

  <section>
    <h2>Devices</h2>
    <div class="row" style="justify-content: space-between; margin-bottom: 8px">
      <span id="ble-status" class="status">idle</span>
      <div class="row" style="gap:8px">
        <button id="ble-forget" title="Drop scanned, idle devices (use after reflashing an ESP32)">Forget</button>
        <button id="ble-scan" class="primary">Scan</button>
      </div>
    </div>
    <table id="devices"><thead><tr><th>Name</th><th>Address</th><th>RSSI</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
  </section>

  <section>
    <h2>Kit</h2>
    <div class="row">
      <label for="kit-select">Experiment</label>
      <select id="kit-select"></select>
      <button id="kit-recommend-toggle" type="button">Recommend from PDF…</button>
    </div>
    <div id="kit-recommend" hidden></div>
    <p id="kit-desc" class="sub" style="margin: 8px 0 0"></p>
    <div id="kit-diagrams"></div>
    <div id="kit-lab-guide"></div>
    <div id="kit-params" class="row" style="margin-top: 12px"></div>
    <div class="row" style="margin-top: 12px">
      <button id="kit-apply" class="primary">Apply kit</button>
      <span id="kit-status" class="status">no kit selected</span>
    </div>
  </section>

  <section>
    <h2>Run</h2>
    <div class="row">
      <input id="run-name" type="text" placeholder="run name (e.g., cart-incline-1)" />
      <button id="arm" class="primary" disabled>Arm</button>
      <button id="stop" class="danger" disabled>Stop</button>
      <span id="run-status" class="status">apply a kit to enable</span>
    </div>
    <div id="run-triggers"></div>
  </section>

  <section>
    <h2>Live</h2>
    <div id="charts"></div>
    <div id="charts-empty" class="lg-empty" style="padding: 14px 0; color: var(--ink-soft); font-style: italic;">
      No live data yet — connect a module above to see its readings here.
    </div>
    <div class="row" style="margin-top:8px">
      <span id="ws-status" class="status">connecting…</span>
      <span style="flex:1"></span>
      <button id="clear-chart">Clear charts</button>
    </div>
  </section>

  <section>
    <h2>History</h2>
    <table id="runs"><thead><tr><th>Run ID</th><th>Name</th><th>Size</th><th></th></tr></thead><tbody></tbody></table>
    <div class="row" style="margin-top:12px; justify-content: flex-end">
      <button id="delete-all" class="danger" title="Debug: delete all stored runs">Delete all runs</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/uplot@1.6.31/dist/uPlot.iife.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
