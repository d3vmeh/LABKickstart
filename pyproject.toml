[project]
name = "labkickstart"
version = "0.1.0"
description = "Open, modular, IoT-enabled physics lab toolkit (ESP32 BLE modules + FastAPI dashboard)."
requires-python = ">=3.11"
# Runtime dependencies are declared in `requirements.txt` (the canonical
# install path: `pip install -r requirements.txt`). This file only carries
# enough metadata for the project to be wheel-buildable in the future.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labkickstart"]
