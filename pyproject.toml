[project]
name = "labkickstart"
version = "0.0.1"
description = "Modular physics lab hub: ESP32 sensors -> Pi -> web UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
ble = ["bleak>=0.22"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labkickstart"]
